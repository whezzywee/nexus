[workspace]
resolver = "2"
members = [
  "apps/gateway",
  "apps/desktop/src-tauri",
  "freenet/contracts/attachment-chunk",
  "freenet/contracts/attachment-index",
  "freenet/contracts/community-membership",
  "freenet/contracts/message-segment",
  "freenet/contracts/private-conversation",
  "freenet/contracts/release-manifest",
  "freenet/contracts/voice-session",
  "packages/protocol-rs",
  "tests/freenet-two-node",
]
exclude = ["tests/support/freenet-test-network"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
axum = { version = "=0.8.4", features = ["ws"] }
base64 = "=0.22.1"
ciborium = "=0.2.2"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
flate2 = "=1.1.9"
freenet-stdlib = { version = "=0.8.4", features = ["contract"] }
hex = "=0.4.3"
hmac = "=0.12.1"
rand = "=0.8.6"
reqwest = { version = "=0.12.22", default-features = false, features = ["json", "rustls-tls"] }
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
tar = "=0.4.46"
thiserror = "=2.0.12"
tokio = { version = "=1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.6.11", features = ["cors", "fs", "limit", "set-header", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
