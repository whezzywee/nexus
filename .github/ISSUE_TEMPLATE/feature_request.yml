name: Feature request
description: Propose a focused product or developer improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, security, and compatibility tradeoffs
