name: Trusted Windows release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    environment: production-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - name: Import protected Authenticode certificate
        shell: pwsh
        env:
          NEXUS_CODESIGN_PFX: ${{ secrets.NEXUS_CODESIGN_PFX }}
          NEXUS_CODESIGN_PASSWORD: ${{ secrets.NEXUS_CODESIGN_PASSWORD }}
          NEXUS_CODESIGN_CERT_SHA256: ${{ vars.NEXUS_CODESIGN_CERT_SHA256 }}
        run: |
          if (
            -not $env:NEXUS_CODESIGN_PFX -or
            -not $env:NEXUS_CODESIGN_PASSWORD -or
            -not $env:NEXUS_CODESIGN_CERT_SHA256
          ) {
            throw "Production code-signing secrets and certificate fingerprint are not configured."
          }
          $bytes = [Convert]::FromBase64String($env:NEXUS_CODESIGN_PFX)
          $path = Join-Path $env:RUNNER_TEMP "nexus-codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $path,
            $env:NEXUS_CODESIGN_PASSWORD,
            $flags
          )
          if (-not $certificate.HasPrivateKey) {
            throw "The configured Authenticode certificate has no private key."
          }
          if ($certificate.NotBefore -gt [DateTime]::UtcNow -or $certificate.NotAfter -lt [DateTime]::UtcNow) {
            throw "The configured Authenticode certificate is not currently valid."
          }
          $codeSigningEku = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object { $_.Value -eq "1.3.6.1.5.5.7.3.3" }
          if (-not $codeSigningEku) {
            throw "The configured certificate does not permit code signing."
          }
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $fingerprint = (
              $sha256.ComputeHash($certificate.RawData) |
                ForEach-Object { $_.ToString("x2") }
            ) -join ""
          } finally {
            $sha256.Dispose()
          }
          if ($fingerprint -ne $env:NEXUS_CODESIGN_CERT_SHA256.ToLowerInvariant()) {
            throw "The protected Authenticode certificate does not match the pinned SHA-256 fingerprint."
          }
          "NEXUS_CODESIGN_KEY_PATH=$path" >> $env:GITHUB_ENV
      - name: Build release package
        shell: pwsh
        env:
          NEXUS_RELEASE_TRUST_ROOT_PUBLIC_KEY: ${{ vars.NEXUS_RELEASE_TRUST_ROOT_PUBLIC_KEY }}
          NEXUS_CODESIGN_PASSWORD: ${{ secrets.NEXUS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:NEXUS_RELEASE_TRUST_ROOT_PUBLIC_KEY) {
            throw "The production release trust root is not configured."
          }
          pnpm package:windows
      - name: Verify signed application and installer
        shell: pwsh
        env:
          NEXUS_CODESIGN_CERT_SHA256: ${{ vars.NEXUS_CODESIGN_CERT_SHA256 }}
        run: |
          $installer = Get-ChildItem .artifacts\release -Recurse -Filter *.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          $application = Get-Item target\release\nexus-desktop.exe
          & signtool.exe verify /pa /all /tw $application.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installed application signature verification failed." }
          & signtool.exe verify /pa /all /tw $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed." }
          $applicationSignature = Get-AuthenticodeSignature -LiteralPath $application.FullName
          $installerSignature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          foreach ($signature in @($applicationSignature, $installerSignature)) {
            if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
              throw "A release artifact lacks a valid signature or trusted timestamp."
            }
            $sha256 = [Security.Cryptography.SHA256]::Create()
            try {
              $fingerprint = (
                $sha256.ComputeHash($signature.SignerCertificate.RawData) |
                  ForEach-Object { $_.ToString("x2") }
              ) -join ""
            } finally {
              $sha256.Dispose()
            }
            if ($fingerprint -ne $env:NEXUS_CODESIGN_CERT_SHA256.ToLowerInvariant()) {
              throw "A release artifact was signed by an unexpected certificate."
            }
          }
          $releaseDirectory = $installer.Directory.FullName
          [ordered]@{
            schemaVersion = 1
            verifiedAt = [DateTimeOffset]::UtcNow.ToString("O")
            expectedCertificateSha256 = $env:NEXUS_CODESIGN_CERT_SHA256.ToLowerInvariant()
            application = [ordered]@{
              path = $application.FullName
              sha256 = (Get-FileHash -LiteralPath $application.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              subject = $applicationSignature.SignerCertificate.Subject
              notAfter = $applicationSignature.SignerCertificate.NotAfter.ToUniversalTime().ToString("O")
              timestampSubject = $applicationSignature.TimeStamperCertificate.Subject
            }
            installer = [ordered]@{
              path = $installer.FullName
              sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              subject = $installerSignature.SignerCertificate.Subject
              notAfter = $installerSignature.SignerCertificate.NotAfter.ToUniversalTime().ToString("O")
              timestampSubject = $installerSignature.TimeStamperCertificate.Subject
            }
          } |
            ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $releaseDirectory "authenticode-report.json") -Encoding utf8
          "NEXUS_SIGNED_INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV
          "NEXUS_RELEASE_DIRECTORY=$releaseDirectory" >> $env:GITHUB_ENV
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ env.NEXUS_SIGNED_INSTALLER }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-windows-signed
          if-no-files-found: error
          path: ${{ env.NEXUS_RELEASE_DIRECTORY }}
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "nexus-codesign.pfx"
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Force
          }
